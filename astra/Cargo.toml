[package]
name = "astra_fuzz"
version = "0.0.2"
authors = ["Salim Largo <me@2ourc3.com>"]
edition = "2024"
default-run = "astra_fuzz"


[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
colored_text = "0.3.0"
chrono = "0.4.42"
rand = "0.9.2"
flume = "0.11.1"
wait-timeout = "0.2.1"
libc = "0.2.177"
sha256 = "1.6.0"
rustix = { version = "1.1.2", features = ["fs", "mm", "shm"] }
ctrlc = "3.5.2"

[dev-dependencies]
criterion = "0.7.0"