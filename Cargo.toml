[workspace]
resolver = "2"
members = [
    "astra",
    "astra_cc",
    "astra_cxx",
    "astra_sancov",
]

default-members = [
    "astra",
    "astra_cc",
    "astra_cxx",
    "astra_sancov",
]

[workspace.dependencies]
astra = { path = "./astra"}
astra_cc = { path = "./astra_cc" }
astra_cxx = { path = "./astra_cxx" }
astra_sancov = { path = "./astra_sancov" }

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "Apache-2.0"
readme = "./README.md"
authors = ["Salim Largo <me@2ourc3.com>"]


[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
